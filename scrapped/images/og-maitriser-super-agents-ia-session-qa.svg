<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Top Right Indigo Ambient Glow -->
    <radialGradient id="indigoGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Left Cyan Glow -->
    <radialGradient id="cyanGlow" cx="15%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .post-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .post-meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Ambient Glow Effects -->
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />

  <!-- Decorative Outer Border Card -->
  <rect x="36" y="36" width="1128" height="558" rx="24" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
  <rect x="38" y="38" width="1124" height="554" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Top Header Row -->
  <g transform="translate(80, 84)">
    <!-- Brand Badge -->
    <rect width="132" height="34" rx="17" fill="url(#brandGradient)" />
    <!-- Hugo Hexagon Icon -->
    <polygon points="18,10 27,15 27,25 18,30 9,25 9,15" fill="#ffffff" opacity="0.9" />
    <text x="76" y="22" text-anchor="middle" fill="#ffffff" class="brand-title" font-size="12" font-weight="800" letter-spacing="0.5">HUGO POST</text>

    <!-- Category Pill -->
    <rect x="144" y="0" width="224" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="256" y="22" text-anchor="middle" fill="#e2e8f0" class="brand-title" font-size="12" font-weight="700">Intelligence Artificielle</text>

    <!-- Site Name & Date Right-aligned -->
    <g transform="translate(1040, 22)">
      <text x="0" y="0" text-anchor="end" fill="#94a3b8" class="post-meta" font-size="14" font-weight="600">Hugo Static Blog • 2026-09-11</text>
    </g>
  </g>

  <!-- Accent Top Line -->
  <rect x="80" y="142" width="120" height="3" rx="1.5" fill="url(#brandGradient)" />

  <!-- Main Article Title -->
  <text class="post-title" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-0.5">
    <tspan x="80" y="220">Maîtriser les Super-Agents IA : Session de</tspan>
      <tspan x="80" y="275">Questions-Réponses / Mastering AI</tspan>
      <tspan x="80" y="330">Super-Agents...</tspan>
  </text>

  <!-- Article Description / Excerpt -->
  
  <text class="post-meta" fill="#94a3b8" font-size="20" font-weight="400" line-height="1.5">
    <tspan x="80" y="405">Une session finale de Q&amp;R pour optimiser vos revenus via les</tspan>
      <tspan x="80" y="437">agents...</tspan>
  </text>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 480)">
    <!-- Author Avatar Glyph -->
    <circle cx="20" cy="20" r="18" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <text x="20" y="26" text-anchor="middle" fill="#e0e7ff" class="post-meta" font-size="14" font-weight="700">A</text>
    
    <!-- Author Name -->
    <text x="50" y="26" fill="#f1f5f9" class="post-meta" font-size="16" font-weight="700">Alegria Group</text>

    <!-- Reading Time Badge -->
    <g transform="translate(280, 5)">
      <rect width="205" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#818cf8" font-size="13">⏱</text>
      <text x="32" y="20" fill="#cbd5e1" class="post-meta" font-size="13" font-weight="600">2 min read • 298 words</text>
    </g>
  </g>

  <!-- Tag Chips -->
  
      <g transform="translate(80, 530)">
        <rect width="65" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="32.5" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">#AI</text>
      </g>
      <g transform="translate(157, 530)">
        <rect width="143.5" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="71.75" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">#Super-Agents</text>
      </g>
      <g transform="translate(312.5, 530)">
        <rect width="143.5" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="71.75" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">#AlegriaGroup</text>
      </g>

  <!-- Watermark / Footer Logo -->
  <g transform="translate(1040, 545)">
    <text x="0" y="0" text-anchor="end" fill="#475569" class="brand-title" font-size="12" font-weight="600" letter-spacing="1">GENERATED WITH AI STUDIO</text>
  </g>
</svg>